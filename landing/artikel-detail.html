<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Articles | Icon Holiday Indonesia</title>
<meta name="description" content="Articles and travel info from Icon Holiday Indonesia: visas, flights, cruises and practical tips before you go." />
<meta name="theme-color" content="#0A6E4C" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<main id="main">

<!-- ══ Article ══ -->
<section class="sect">
  <div class="wrap">
    <nav class="crumb crumb--dark" aria-label="Breadcrumb" id="crumb">
      <a href="index.html">Home</a><span>/</span><a href="artikel.html">Articles</a>
    </nav>

    <div class="detail" id="detail">
      <div id="article"></div>
      <aside id="side"></aside>
    </div>
  </div>
</section>

<!-- ══ More articles ══ -->
<section class="sect sect--tint">
  <div class="wrap">
    <p class="eyebrow">Read next</p>
    <h2 class="sect__title">More articles</h2>
    <div class="grid grid--3 reveal" id="moreGrid"></div>
  </div>
</section>

</main>

<script src="./data.js"></script>
<script src="./common.js"></script>
<script>
(function () {
  const esc  = window.esc;
  const NEWS = window.NEWS;

  const detail  = document.getElementById("detail");
  const article = document.getElementById("article");
  const side    = document.getElementById("side");
  const crumb   = document.getElementById("crumb");
  const more    = document.getElementById("moreGrid");

  const id   = window.qs("id");
  const item = NEWS.find((n) => n.id === id);

  const card = (n) => `
    <a class="news" href="artikel-detail.html?id=${esc(encodeURIComponent(n.id))}">
      <div class="news__media"><img src="${esc(n.img)}" alt="" loading="lazy" decoding="async" /></div>
      <div class="news__body">
        <p class="news__meta">${esc(n.tag)} · ${esc(n.date)}</p>
        <h3>${esc(n.title)}</h3>
        <p>${esc(n.sum)}</p>
      </div>
    </a>`;

  if (!item) {
    document.title = "Article not found | Icon Holiday Indonesia";
    detail.className = "";
    detail.innerHTML = `
      <div class="empty">
        <h1 class="empty__title">Article not found</h1>
        <p>The link may have changed, or the article is no longer published.</p>
        <p class="note"><a class="btn btn--ghost" href="artikel.html"><svg class="i"><use href="#i-back"/></svg> Back to the article list</a></p>
      </div>`;
    more.innerHTML = NEWS.slice(0, 3).map(card).join("");
    window.initReveal();
    return;
  }

  /* ── Document title & breadcrumb ─────────────────────────── */
  document.title = `${item.title} | Icon Holiday Indonesia`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", item.sum);
  crumb.insertAdjacentHTML("beforeend", `<span>/</span>${esc(item.tag)}`);

  /* ── Article body ────────────────────────────────────────── */
  article.innerHTML = `
    <div class="article__hero">
      <img src="${esc(item.img)}" alt="${esc(item.title)}" loading="lazy" decoding="async" />
    </div>
    <p class="article__meta">${esc(item.tag)} · ${esc(item.date)}</p>
    <h1>${esc(item.title)}</h1>
    <p class="sect__lead">${esc(item.sum)}</p>
    <div class="article__body">
      ${item.body.map((p) => `<p>${esc(p)}</p>`).join("")}
    </div>`;

  /* ── Sidebar ─────────────────────────────────────────────── */
  const others = NEWS.filter((n) => n.id !== item.id);
  side.innerHTML = `
    <div class="panel">
      <h2><svg class="i"><use href="#i-phone"/></svg> Have a question?</h2>
      <p>Travel rules change more often than articles get updated. Check with our team before you prepare your documents.</p>
      <p class="note"><a class="btn btn--primary" href="kontak.html">Contact us <svg class="i"><use href="#i-arrow"/></svg></a></p>
    </div>
    <div class="panel">
      <h2><svg class="i"><use href="#i-doc"/></svg> Other topics</h2>
      ${others.slice(0, 4).map((n) => `
        <p class="office__tel"><a href="artikel-detail.html?id=${esc(encodeURIComponent(n.id))}">${esc(n.title)}</a></p>`).join("")}
      <p class="note"><a class="btn btn--ghost" href="artikel.html"><svg class="i"><use href="#i-back"/></svg> All articles</a></p>
    </div>`;

  /* ── More articles ───────────────────────────────────────── */
  more.innerHTML = others.slice(0, 3).map(card).join("");
  window.initReveal();
})();
</script>
</body>
</html>
