<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tour Package Details | Icon Holiday Indonesia</title>
<meta name="description" content="Icon Holiday tour package details: daily itinerary, trip highlights, price per person, departure dates, and what is and isn't included." />
<meta name="theme-color" content="#0A6E4C" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<main id="main">

<!-- ══ Package hero ══ -->
<section class="phero">
  <div class="phero__bg" id="tdBg" aria-hidden="true"></div>
  <div class="wrap phero__in" id="tdHead"></div>
</section>

<!-- ══ Package content ══ -->
<section class="sect">
  <div class="wrap" id="tdBody"></div>
</section>

</main>

<script src="./data.js"></script>
<script src="./common.js"></script>
<script>
(() => {
  const TOURS = window.TOURS || [];
  const tour = TOURS.find((t) => t.id === qs("id"));
  const bg = document.getElementById("tdBg");
  const head = document.getElementById("tdHead");
  const body = document.getElementById("tdBody");

  /* ── Package not found ─────────────────────────────────────── */
  if (!tour) {
    document.title = "Package not found | Icon Holiday";
    head.innerHTML = `
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">/</span>
        <a href="tour.html">Tour 2026</a>
        <span aria-hidden="true">/</span>
        <span>Package not found</span>
      </nav>
      <h1>Package not found</h1>
      <p>The link you opened may have expired, or the package has closed for this year.</p>`;
    body.innerHTML = `
      <div class="empty">
        <b>Package not found</b>
        Go back to the package list to see the departures still available.
        <p class="note"><a class="btn btn--primary" href="tour.html"><svg class="i"><use href="#i-back"/></svg> View all 2026 packages</a></p>
      </div>`;
    return;
  }

  /* ── Hero ──────────────────────────────────────────────────── */
  document.title = `${tour.title} | Icon Holiday`;
  bg.style.backgroundImage = `url("${tour.img}")`;

  const dates = tour.dates || [];
  head.innerHTML = `
    <nav class="crumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <a href="tour.html">Tour 2026</a>
      <span aria-hidden="true">/</span>
      <span>${esc(tour.title)}</span>
    </nav>
    <p class="eyebrow eyebrow--light">Tour Package</p>
    <h1>${esc(tour.title)}</h1>
    <p>${esc(tour.country)} &nbsp;·&nbsp; ${esc(tour.days)} days / ${esc(tour.nights)} nights &nbsp;·&nbsp; ${dates.length} ${dates.length === 1 ? "departure" : "departures"}</p>`;

  /* ── Left column ───────────────────────────────────────────── */
  const highlights = tour.highlights || [];
  const itinerary = tour.itinerary || [];
  const includes = tour.includes || [];
  const excludes = tour.excludes || [];
  const gallery = tour.gallery || [];

  const panelHighlights = highlights.length ? `
    <article class="panel">
      <h2><svg class="i"><use href="#i-pin"/></svg> Trip highlights</h2>
      <ul class="incl">
        ${highlights.map((h) => `<li><svg class="i"><use href="#i-pin"/></svg> ${esc(h)}</li>`).join("")}
      </ul>
    </article>` : "";

  const panelItinerary = itinerary.length ? `
    <article class="panel">
      <h2><svg class="i"><use href="#i-cal"/></svg> Daily itinerary</h2>
      <ol class="days">
        ${itinerary.map((it) => `
          <li>
            <b>Day ${esc(it.d)}</b>
            <div><h3>${esc(it.t)}</h3><p>${esc(it.x)}</p></div>
          </li>`).join("")}
      </ol>
    </article>` : "";

  const panelIncl = (includes.length || excludes.length) ? `
    <article class="panel">
      <h2><svg class="i"><use href="#i-check"/></svg> Included / Not included</h2>
      ${includes.length ? `<ul class="incl incl--yes">
        ${includes.map((i) => `<li><svg class="i"><use href="#i-check"/></svg> ${esc(i)}</li>`).join("")}
      </ul>` : ""}
      ${excludes.length ? `<p class="note">Not included: you will need to arrange these yourself</p>
      <ul class="incl incl--no">
        ${excludes.map((x) => `<li><svg class="i"><use href="#i-x"/></svg> ${esc(x)}</li>`).join("")}
      </ul>` : ""}
    </article>` : "";

  const panelGallery = gallery.length > 1 ? `
    <article class="panel">
      <h2><svg class="i"><use href="#i-grid"/></svg> On the road</h2>
      <div class="gal__strip">
        ${gallery.map((g, i) => `<img src="${esc(g)}" alt="${esc(tour.country)}, photo ${i + 1}" loading="lazy" decoding="async" />`).join("")}
      </div>
    </article>` : "";

  /* ── Price card ────────────────────────────────────────────── */
  const was = tour.priceBefore && tour.price && tour.priceBefore > tour.price
    ? `<p class="buy__was">${esc(rp(tour.priceBefore))}</p>` : "";

  const buy = `
    <aside class="buy" aria-label="Price and booking summary">
      ${was}
      <p class="buy__price">${tour.price ? esc(rp(tour.price)) : "Contact us"}</p>
      <p class="buy__unit">${tour.price ? "per person" : "for the latest price"}</p>

      <div class="buy__meta">
        <div><span><svg class="i"><use href="#i-clock"/></svg> Duration</span><b>${esc(tour.days)} days / ${esc(tour.nights)} nights</b></div>
        <div><span><svg class="i"><use href="#i-cal"/></svg> Departures</span><b>${dates.length} ${dates.length === 1 ? "date" : "dates"}</b></div>
        <div><span><svg class="i"><use href="#i-users"/></svg> Seats left</span><b>${esc(tour.seats)} seats</b></div>
      </div>

      <p class="buy__unit">Departure dates</p>
      <div class="grid">
        <div class="dates">${dates.map((d) => `<span>${esc(d)}</span>`).join("")}</div>
        <a class="btn btn--primary" href="kontak.html?tour=${encodeURIComponent(tour.id)}">
          Ask about this package <svg class="i"><use href="#i-arrow"/></svg>
        </a>
        <a class="btn btn--ghost" data-link="app" href="#">
          <svg class="i"><use href="#i-phone-app"/></svg> View in the app
        </a>
      </div>

      <p class="buy__note">Prices may change with exchange rates and seat availability. Seats are held only once the deposit is received.</p>
    </aside>`;

  /* ── Assemble the page ─────────────────────────────────────── */
  body.innerHTML = `
    <div class="detail">
      <div>
        <article class="panel">
          <h2><svg class="i"><use href="#i-map"/></svg> About this package</h2>
          <p>${esc(tour.summary)}</p>
        </article>
        ${panelHighlights}
        ${panelItinerary}
        ${panelIncl}
        ${panelGallery}
      </div>
      ${buy}
    </div>`;

  /* common.js fills [data-link] on load; repeat it for the new elements */
  document.querySelectorAll("[data-link]").forEach((a) => {
    const target = window.LINKS[a.dataset.link];
    if (target) a.href = target;
  });
})();
</script>
</body>
</html>
