# Icon Holiday — static hosting for the SPA + the landing site.
#
# Routing rules that matter here:
#   /landing/*  → real .html files on disk. These must NEVER fall back to the
#                 SPA, otherwise a typo'd landing URL would silently render the
#                 React app instead of a 404.
#   everything  → falls back to /index.html, because the app uses BrowserRouter
#     else        (not hash routing), so /dashboard, /admin, /packages/:id …
#                 are handled client-side and have no file on disk.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compression (nginx:alpine ships without brotli).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/manifest+json image/svg+xml;

    # ---- hashed build assets: safe to cache forever -----------------------
    location /app/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- service worker: must always be revalidated -----------------------
    # A cached sw.js pins users to an old build indefinitely.
    location = /app/sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /app/manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # ---- root belongs to the landing page ---------------------------------
    # A redirect (rather than serving the file here) keeps the landing site's
    # relative links — tour.html, styles.css — resolving correctly.
    location = / {
        return 302 /landing/;
    }

    # Friendly alias for the CMS.
    location = /admin {
        return 302 /app/admin;
    }

    # ---- company-profile site: real files, no SPA fallback ----------------
    location /landing/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---- the SPA, mounted at /app/ ----------------------------------------
    location /app/ {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html itself is never cached, so a deploy is picked up at once
        # while its hashed assets stay immutable.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    # Anything else that isn't a real file goes to the landing page rather than
    # silently booting the app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /landing/index.html;
    }

    # Don't serve dotfiles that somehow made it into the bundle.
    location ~ /\. {
        deny all;
    }
}
