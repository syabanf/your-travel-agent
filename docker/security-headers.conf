# Shared response headers.
#
# NOTE: nginx's `add_header` does NOT inherit into a `location` that declares
# its own `add_header` — the child block replaces the whole set. So instead of
# setting these once at server level, every location `include`s this file.
add_header X-Content-Type-Options   "nosniff"                        always;
add_header X-Frame-Options          "SAMEORIGIN"                     always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(self), camera=(), microphone=()" always;
