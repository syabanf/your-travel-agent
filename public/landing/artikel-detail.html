<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artikel — Icon Holiday Indonesia</title>
<meta name="description" content="Artikel dan info perjalanan dari Icon Holiday Indonesia — visa, penerbangan, cruise dan tips praktis sebelum berangkat." />
<meta name="theme-color" content="#0B1B3B" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<a href="#main" class="skip-link">Lompat ke konten</a>

<main id="main">

<!-- ══ Artikel ══ -->
<section class="sect">
  <div class="wrap">
    <nav class="crumb crumb--dark" aria-label="Breadcrumb" id="crumb">
      <a href="index.html">Home</a><span>/</span><a href="artikel.html">Artikel</a>
    </nav>

    <div class="detail" id="detail">
      <div id="article"></div>
      <aside id="side"></aside>
    </div>
  </div>
</section>

<!-- ══ Artikel lainnya ══ -->
<section class="sect sect--tint">
  <div class="wrap">
    <p class="eyebrow">Baca juga</p>
    <h2 class="sect__title">Artikel lainnya</h2>
    <div class="grid grid--3 reveal" id="moreGrid"></div>
  </div>
</section>

</main>

<script src="./data.js"></script>
<script src="./common.js"></script>
<script>
(function () {
  const esc  = window.esc;
  const NEWS = window.NEWS;

  const detail  = document.getElementById("detail");
  const article = document.getElementById("article");
  const side    = document.getElementById("side");
  const crumb   = document.getElementById("crumb");
  const more    = document.getElementById("moreGrid");

  const id   = window.qs("id");
  const item = NEWS.find((n) => n.id === id);

  const card = (n) => `
    <a class="news" href="artikel-detail.html?id=${esc(encodeURIComponent(n.id))}">
      <div class="news__media"><img src="${esc(n.img)}" alt="" loading="lazy" decoding="async" /></div>
      <div class="news__body">
        <p class="news__meta">${esc(n.tag)} · ${esc(n.date)}</p>
        <h3>${esc(n.title)}</h3>
        <p>${esc(n.sum)}</p>
      </div>
    </a>`;

  if (!item) {
    document.title = "Artikel tidak ditemukan — Icon Holiday Indonesia";
    detail.className = "";
    detail.innerHTML = `
      <div class="empty">
        <b>Artikel tidak ditemukan</b>
        Tautannya mungkin sudah berubah atau artikelnya sudah tidak tayang.
        <p class="note"><a class="btn btn--ghost" href="artikel.html"><svg class="i"><use href="#i-back"/></svg> Kembali ke daftar artikel</a></p>
      </div>`;
    more.innerHTML = NEWS.slice(0, 3).map(card).join("");
    window.initReveal();
    return;
  }

  /* ── Judul dokumen & breadcrumb ──────────────────────────── */
  document.title = `${item.title} — Icon Holiday Indonesia`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", item.sum);
  crumb.insertAdjacentHTML("beforeend", `<span>/</span>${esc(item.tag)}`);

  /* ── Isi artikel ─────────────────────────────────────────── */
  article.innerHTML = `
    <div class="article__hero">
      <img src="${esc(item.img)}" alt="${esc(item.title)}" loading="lazy" decoding="async" />
    </div>
    <p class="article__meta">${esc(item.tag)} · ${esc(item.date)}</p>
    <h1>${esc(item.title)}</h1>
    <p class="sect__lead">${esc(item.sum)}</p>
    <div class="article__body">
      ${item.body.map((p) => `<p>${esc(p)}</p>`).join("")}
    </div>`;

  /* ── Sidebar ─────────────────────────────────────────────── */
  const others = NEWS.filter((n) => n.id !== item.id);
  side.innerHTML = `
    <div class="panel">
      <h2><svg class="i"><use href="#i-phone"/></svg> Ada yang ingin ditanyakan?</h2>
      <p>Ketentuan perjalanan berubah lebih sering daripada artikel diperbarui. Konfirmasikan dulu ke tim kami sebelum menyiapkan dokumen.</p>
      <p class="note"><a class="btn btn--primary" href="kontak.html">Hubungi kami <svg class="i"><use href="#i-arrow"/></svg></a></p>
    </div>
    <div class="panel">
      <h2><svg class="i"><use href="#i-doc"/></svg> Topik lainnya</h2>
      ${others.slice(0, 4).map((n) => `
        <p class="office__tel"><a href="artikel-detail.html?id=${esc(encodeURIComponent(n.id))}">${esc(n.title)}</a></p>`).join("")}
      <p class="note"><a class="btn btn--ghost" href="artikel.html"><svg class="i"><use href="#i-back"/></svg> Semua artikel</a></p>
    </div>`;

  /* ── Artikel lainnya ─────────────────────────────────────── */
  more.innerHTML = others.slice(0, 3).map(card).join("");
  window.initReveal();
})();
</script>
</body>
</html>
